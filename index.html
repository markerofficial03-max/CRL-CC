<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Protected Ticketing System</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #eef2f5; padding: 20px; }
        header { background: #1a252f; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 5px; }
        select, input, button { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; width: 100%; }
        button { background: #27ae60; color: white; cursor: pointer; border: none; font-weight: bold; }
        .main { display: flex; gap: 20px; margin-top: 20px; }
        .left { flex: 3; }
        .right { flex: 1; background: white; padding: 15px; border-radius: 5px; height: 80vh; overflow-y: auto; }
        .card { background: white; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .tab { width: auto; display: inline-block; padding: 8px 15px; background: #95a5a6; }
        .tab.active { background: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f8f9fa; }
        .pending-card { background: #fff3cd; border-left: 5px solid #ffc107; padding: 10px; margin-bottom: 10px; border-radius: 3px; font-size: 12px; }
        .overdue { background: #f8d7da; border-left-color: #dc3545; color: #721c24; }
        .hidden { display: none !important; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .login-overlay { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<!-- LOGIN FORM -->
<div id="loginScreen" class="login-overlay">
    <h2>System Login</h2>
    <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Please sign in to access the system</p>
    <form onsubmit="handleLogin(event)">
        <label>Username</label>
        <input type="text" id="loginUser" required placeholder="admin or emp">
        <label>Password</label>
        <input type="password" id="loginPass" required placeholder="admin123 or emp123">
        <button type="submit" style="margin-top: 15px; padding: 10px;">Login</button>
    </form>
</div>

<!-- APP DASHBOARD -->
<div id="appScreen" class="hidden">
    <header>
        <h2>Helpdesk Portal</h2>
        <div>
            Logged in as: <strong id="userDisplay"></strong> (<span id="roleDisplay"></span>) | 
            <button onclick="handleLogout()" style="width: auto; background: #c0392b; padding: 5px 10px;">Logout</button>
        </div>
    </header>

    <div class="main">
        <div class="left">
            <!-- EMPLOYEE VIEW -->
            <div id="employeeView">
                <div class="card">
                    <div>
                        <button class="tab active" onclick="setCategory('INCOMING', this)">Incoming Call</button>
                        <button class="tab" onclick="setCategory('OUTGOING', this)">Outgoing Call</button>
                    </div>
                    <h3 id="formTitle" style="margin: 15px 0;">Incoming Query Form</h3>
                    <form id="queryForm" onsubmit="submitQuery(event)" class="grid">
                        <div><label>Department</label><select id="qDept" required></select></div>
                        <div><label>Query Type</label><select id="qType" required></select></div>
                        <div><label>Barcode</label><input type="text" id="qBarcode" required></div>
                        <div><label>Caller Name</label><input type="text" id="qCallerName" required></div>
                        <div><label>Caller No.</label><input type="text" id="qCallerNo" required></div>
                        <div><label>Client Code</label><input type="text" id="qClientCode" required></div>
                        <div>
                            <label>Call Action</label>
                            <select id="qAction">
                                <option value="QUERY">New Query (1hr SLA)</option>
                                <option value="UPDATE">Update Status</option>
                            </select>
                        </div>
                        <div><label>Call End Time</label><input type="time" id="qEndTime" required></div>
                        <div style="grid-column: span 2;">
                            <button type="submit" style="padding: 12px;">Submit Query</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ADMIN VIEW -->
            <div id="adminView" class="hidden">
                <div class="card">
                    <h3>Admin Management</h3>
                    <div class="grid">
                        <div>
                            <h4>Add Department</h4>
                            <input type="text" id="newDept"><button onclick="addDept()">Add Dept</button>
                        </div>
                        <div>
                            <h4>Add Query Type</h4>
                            <input type="text" id="newType"><button onclick="addType()">Add Type</button>
                        </div>
                        <div>
                            <h4>Create / Reset User</h4>
                            <input type="text" id="uName" placeholder="Username">
                            <input type="password" id="uPass" placeholder="Password">
                            <select id="uRole">
                                <option value="employee">Employee</option>
                                <option value="admin">Admin</option>
                            </select>
                            <button onclick="addUser()">Save User</button>
                        </div>
                        <div>
                            <h4>Data Maintenance</h4>
                            <button onclick="exportAndClean()" style="background:#8e44ad;">Auto-Export & Clean (>30 Days)</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3>All System Tickets</h3>
                    <input type="text" id="searchBox" placeholder="Search entries..." oninput="loadQueries()">
                    <table>
                        <thead>
                            <tr>
                                <th>Ticket #</th>
                                <th>Category</th>
                                <th>Caller</th>
                                <th>Dept</th>
                                <th>Barcode</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="queryTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="right">
            <h3>Pending Queries</h3>
            <div id="pendingList"></div>
        </div>
    </div>
</div>

<script>
    let currentCategory = 'INCOMING';

    async function checkAuth() {
        const res = await fetch('/api/me');
        if (res.ok) {
            const user = await res.json();
            showDashboard(user);
        } else {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appScreen').classList.add('hidden');
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUser').value;
        const password = document.getElementById('loginPass').value;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
            showDashboard(data);
        } else {
            alert(data.error);
        }
    }

    async function handleLogout() {
        await fetch('/api/logout', { method: 'POST' });
        location.reload();
    }

    function showDashboard(user) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('appScreen').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = user.username;
        document.getElementById('roleDisplay').innerText = user.role.toUpperCase();

        if (user.role === 'admin') {
            document.getElementById('adminView').classList.remove('hidden');
        } else {
            document.getElementById('adminView').classList.add('hidden');
        }

        loadMasters();
        loadQueries();
    }

    async function loadMasters() {
        const res = await fetch('/api/masters');
        if(!res.ok) return;
        const data = await res.json();
        document.getElementById('qDept').innerHTML = '<option value="">Select Dept</option>' + data.departments.map(d=>`<option value="${d}">${d}</option>`).join('');
        document.getElementById('qType').innerHTML = '<option value="">Select Type</option>' + data.types.map(t=>`<option value="${t}">${t}</option>`).join('');
    }

    function setCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('formTitle').innerText = `${cat} Query Form`;
    }

    async function submitQuery(e) {
        e.preventDefault();
        const payload = {
            category: currentCategory,
            dept: document.getElementById('qDept').value,
            queryType: document.getElementById('qType').value,
            barcode: document.getElementById('qBarcode').value,
            callerName: document.getElementById('qCallerName').value,
            callerNo: document.getElementById('qCallerNo').value,
            clientCode: document.getElementById('qClientCode').value,
            callAction: document.getElementById('qAction').value,
            endTime: document.getElementById('qEndTime').value
        };

        const res = await fetch('/api/queries', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        alert(`Ticket Created: ${result.ticketNo}`);
        document.getElementById('queryForm').reset();
        loadQueries();
    }

    async function loadQueries() {
        const search = document.getElementById('searchBox').value;
        const res = await fetch(`/api/queries?search=${encodeURIComponent(search)}`);
        if(!res.ok) return;
        const data = await res.json();

        const tbody = document.getElementById('queryTableBody');
        if(tbody) {
            tbody.innerHTML = data.map(q => `
                <tr>
                    <td>${q.ticket_no}</td>
                    <td>${q.category}</td>
                    <td>${q.caller_name}</td>
                    <td>${q.dept}</td>
                    <td>${q.barcode}</td>
                    <td><b>${q.status}</b></td>
                    <td>
                        <button onclick="updateStatus('${q.ticket_no}', 'RESOLVED')">Resolve</button>
                    </td>
                </tr>
            `).join('');
        }

        const pendingContainer = document.getElementById('pendingList');
        pendingContainer.innerHTML = '';
        data.filter(q => q.status === 'PENDING' || q.status === 'FORWARDED').forEach(q => {
            const diffMins = Math.floor((new Date() - new Date(q.start_time)) / 60000);
            pendingContainer.innerHTML += `
                <div class="pending-card ${diffMins >= 60 ? 'overdue' : ''}">
                    <strong>#${q.ticket_no}</strong> (${q.category})<br>
                    <b>Name:</b> ${q.caller_name} | <b>BC:</b> ${q.barcode}<br>
                    <b>Time Elapsed:</b> ${diffMins} Mins ${diffMins >= 60 ? '<b>(OVERDUE)</b>' : ''}<br>
                    <button onclick="updateStatus('${q.ticket_no}', 'RESOLVED')" style="font-size:10px; margin-top:5px;">Resolve</button>
                </div>
            `;
        });
    }

    async function updateStatus(ticketNo, status) {
        await fetch(`/api/queries/${ticketNo}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ status })
        });
        loadQueries();
    }

    async function addUser() {
        const username = document.getElementById('uName').value;
        const password = document.getElementById('uPass').value;
        const role = document.getElementById('uRole').value;
        const res = await fetch('/api/users', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password, role })
        });
        const data = await res.json();
        alert(data.message || data.error);
    }

    async function addDept() {
        const name = document.getElementById('newDept').value;
        await fetch('/api/departments', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) });
        loadMasters();
    }

    async function addType() {
        const name = document.getElementById('newType').value;
        await fetch('/api/query-types', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) });
        loadMasters();
    }

    async function exportAndClean() {
        const res = await fetch('/api/export-and-cleanup');
        const data = await res.json();
        alert(data.message);
        loadQueries();
    }

    window.onload = checkAuth;
</script>
</body>
</html>
